name: Deploy — Production SunuShop

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible"
        required: true
        default: "production"
        type: choice
        options: [production, staging]

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérification des secrets de production
        env:
          JWT_ACCESS_SECRET:  ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          METRICS_SECRET:     ${{ secrets.METRICS_SECRET }}
          GRAFANA_PASSWORD:   ${{ secrets.GRAFANA_PASSWORD }}
          MONGODB_URI:        ${{ secrets.MONGODB_URI }}
          STRIPE_SECRET_KEY:  ${{ secrets.STRIPE_SECRET_KEY }}
          WAVE_API_KEY:       ${{ secrets.WAVE_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: bash scripts/check-secrets.sh

      - name: Build server Docker image
        run: |
          docker build \
            -t sunushop-server:${{ github.sha }} \
            -t sunushop-server:latest \
            -f Dockerfile.server \
            --target runner \
            .

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /app/sunushop
            git pull origin main
            docker compose -f docker-compose.prod.yml pull --ignore-buildable
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker system prune -f
            echo "Deploy $(git rev-parse --short HEAD) termine"
