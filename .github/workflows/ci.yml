name: CI — SunuShop

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Annule automatiquement les runs obsolètes sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 — BACKEND  (Build · Lint · Tests obligatoires · Coverage)
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Build · Lint · Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Lint
        run: npm run lint

      # --passWithNoTests supprimé : si aucun test n'existe, le CI échoue.
      # --forceExit évite que Jest reste suspendu (connexions MongoDB/Redis ouvertes).
      - name: Run tests with coverage (strict)
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/sunushop_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars
        run: npm test -- --coverage --forceExit

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 14

      - name: Coverage → Step Summary
        if: always()
        working-directory: server
        run: |
          echo "## 🧪 Backend — Couverture des tests" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const fmt  = v => v.pct.toFixed(1) + '%';
              const icon = v => v.pct >= 80 ? '✅' : v.pct >= 60 ? '⚠️' : '❌';
              const rows = [
                ['Lignes',     c.lines],
                ['Branches',   c.branches],
                ['Fonctions',  c.functions],
                ['Statements', c.statements],
              ];
              console.log('| Métrique | Couverture | Seuil 80% |');
              console.log('|----------|:----------:|:---------:|');
              rows.forEach(([k, v]) =>
                console.log(\`| \${k} | \${fmt(v)} | \${icon(v)} |\`)
              );
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ coverage-summary.json introuvable — vérifiez la config Jest (coverageReporters: ['json-summary'])" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 — FRONTEND  (Build · Lint · Tests obligatoires · Coverage)
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build · Lint · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # --passWithNoTests supprimé : au moins un fichier *.test.tsx doit exister.
      # --reporter verbose : affiche chaque test individuellement dans les logs.
      # --coverage activé via @vitest/coverage-v8 (ajouté aux devDependencies).
      - name: Run tests with coverage (strict)
        run: npm test -- --coverage --reporter verbose

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: client/coverage/
          retention-days: 14

      - name: Coverage → Step Summary
        if: always()
        working-directory: client
        run: |
          echo "## 🧪 Frontend — Couverture des tests" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const fmt  = v => v.pct.toFixed(1) + '%';
              const icon = v => v.pct >= 70 ? '✅' : v.pct >= 50 ? '⚠️' : '❌';
              const rows = [
                ['Lignes',     c.lines],
                ['Branches',   c.branches],
                ['Fonctions',  c.functions],
                ['Statements', c.statements],
              ];
              console.log('| Métrique | Couverture | Seuil |');
              console.log('|----------|:----------:|:-----:|');
              rows.forEach(([k, v]) =>
                console.log(\`| \${k} | \${fmt(v)} | \${icon(v)} |\`)
              );
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ coverage-summary.json introuvable — vérifiez vitest.config.ts (reporter: json-summary)" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 — SÉCURITÉ  (Audit dépendances — bloque sur HIGH/CRITICAL)
  # ──────────────────────────────────────────────────────────────────────────
  security:
    name: Security — Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit backend (high + critical uniquement)
        working-directory: server
        run: npm audit --audit-level=high

      - name: Audit frontend (high + critical uniquement)
        working-directory: client
        run: npm audit --audit-level=high

      - name: Résumé sécurité → Step Summary
        if: always()
        run: |
          echo "## 🔒 Audit de sécurité" >> $GITHUB_STEP_SUMMARY
          echo "| Périmètre | Commande |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (server/) | npm audit --audit-level=high |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (client/) | npm audit --audit-level=high |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Les vulnérabilités **low** et **moderate** sont ignorées. Seules **high** et **critical** bloquent le pipeline." >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4 — E2E Playwright  (PR + main + develop — BLOQUANT)
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Tourne sur toutes les branches déclenchantes (PR + push main/develop).
    # continue-on-error supprimé : un échec E2E bloque le pipeline.
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Installe root + server + client pour que le webServer Playwright puisse
      # lancer npm run dev:server et npm run dev:client
      - name: Install all dependencies
        run: npm run install:all

      - name: Install Playwright (Chromium uniquement)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:5173
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/sunushop_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars

        run: npx playwright test

      # Le rapport est toujours uploadé — même en succès — pour review post-run
      - name: Upload rapport Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: E2E → Step Summary
        if: always()
        run: |
          echo "## 🎭 E2E — Playwright" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Tous les tests E2E ont passé." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Des tests E2E ont échoué. Téléchargez l'artifact **playwright-report** pour les screenshots/traces." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Navigateurs testés :** Chromium, Mobile Chrome (Pixel 5)" >> $GITHUB_STEP_SUMMARY
          echo "**Specs couvertes :** auth · checkout · admin · wishlist" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 5 — k6 Smoke Test  (main branch uniquement — non bloquant)
  # ──────────────────────────────────────────────────────────────────────────
  k6-smoke:
    name: k6 — Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Tourne uniquement sur main pour ne pas ralentir les PRs.
    # continue-on-error : un échec k6 est signalé mais ne bloque pas le merge.
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build

      # Start API in background
      - name: Start API server
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/sunushop_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars
          CLIENT_URL: http://localhost:5173
        run: node dist/server.js &

      - name: Wait for API to be ready
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:5000/health && echo "API ready" && break
            echo "Waiting for API... ($i/15)"
            sleep 2
          done

      - name: Install k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq && sudo apt-get install -y k6

      - name: Run k6 smoke test
        env:
          BASE_URL: http://localhost:5000/api/v1
        run: k6 run --out json=k6-results.json k6/smoke.js

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-smoke-results
          path: k6-results.json
          retention-days: 7

      - name: k6 → Step Summary
        if: always()
        run: |
          echo "## ⚡ k6 Smoke Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Smoke test passé — API répond correctement sous charge minimale." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Smoke test échoué ou dégradé — vérifiez les seuils dans k6/smoke.js." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Seuil | Valeur cible |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|:------------:|" >> $GITHUB_STEP_SUMMARY
          echo "| p95 latency | < 500ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Error rate  | < 1%    |" >> $GITHUB_STEP_SUMMARY
          echo "| VUs         | 1       |" >> $GITHUB_STEP_SUMMARY
          echo "| Duration    | 30s     |" >> $GITHUB_STEP_SUMMARY
