# =============================================================
# Sunu Shop — nginx.conf (configuration principale)
# Architecture : Client → Cloudflare CDN → Nginx → Node.js → MongoDB
# =============================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------------
    # Cloudflare — Restauration de la vraie IP client
    # Doit être chargé AVANT les zones de rate limiting
    # ----------------------------------------------------------
    include /etc/nginx/snippets/cloudflare-ips.conf;

    # ----------------------------------------------------------
    # Logging (inclut CF-Ray-ID pour le debug Cloudflare)
    # ----------------------------------------------------------
    log_format main '$remote_addr [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ut="$upstream_response_time" '
                    'cfray="$http_cf_ray" cfcountry="$http_cf_ipcountry"';

    access_log  /var/log/nginx/access.log  main  buffer=32k  flush=5s;
    error_log   /var/log/nginx/error.log   warn;

    # ----------------------------------------------------------
    # Performances
    # ----------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    keepalive_requests  1000;
    types_hash_max_size 4096;
    server_tokens       off;

    client_max_body_size    20m;
    client_body_buffer_size 128k;
    client_header_timeout   15s;
    client_body_timeout     15s;
    send_timeout            15s;

    # ----------------------------------------------------------
    # Gzip (Cloudflare recompresse lui-même vers les visiteurs,
    # mais le gzip origin→Cloudflare réduit la bande passante)
    # ----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/bmp
        image/svg+xml
        image/vnd.microsoft.icon
        image/x-icon
        text/cache-manifest
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/vcard;

    # ----------------------------------------------------------
    # Rate limiting — basé sur la vraie IP (après CF real_ip)
    # ----------------------------------------------------------
    limit_req_zone  $binary_remote_addr  zone=general:10m   rate=100r/m;
    limit_req_zone  $binary_remote_addr  zone=auth:10m      rate=5r/m;
    limit_req_zone  $binary_remote_addr  zone=payments:10m  rate=20r/m;
    limit_req_zone  $binary_remote_addr  zone=uploads:10m   rate=10r/m;
    limit_conn_zone $binary_remote_addr  zone=connections:10m;

    # ----------------------------------------------------------
    # Cache proxy (réponses API publiques — produits, catégories)
    # ----------------------------------------------------------
    proxy_cache_path /var/cache/nginx/api
        levels=1:2
        keys_zone=api_cache:10m
        max_size=500m
        inactive=60m
        use_temp_path=off;

    # ----------------------------------------------------------
    # Upstream — API Node.js
    #
    # Scaling horizontal : décommenter server2 (et server3...)
    # Redis + Socket.io adapter déjà configurés → prêt pour multi-node
    #
    # Algorithme : least_conn distribue vers le nœud le moins chargé
    # ----------------------------------------------------------
    upstream api_backend {
        least_conn;

        server server:5000;
        # server server2:5000;  # Node 2 — décommenter pour scaling
        # server server3:5000;  # Node 3 — décommenter pour scaling

        keepalive 64;
        keepalive_requests 200;
        keepalive_timeout  65s;
    }

    # ----------------------------------------------------------
    # Inclure les virtual hosts
    # ----------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
