# =============================================================
# sunushop.conf — Serveur HTTPS principal
# Architecture : Cloudflare CDN → Nginx (origine) → Node.js API
#
# Mode SSL Cloudflare recommandé : Full (strict)
# → Cloudflare vérifie le certificat de l'origine (Let's Encrypt)
# =============================================================

# --- Redirection sunushop.sn → www.sunushop.sn ---
server {
    listen       443 ssl http2;
    listen  [::]:443 ssl http2;
    server_name  sunushop.sn;

    ssl_certificate     /etc/letsencrypt/live/sunushop.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunushop.sn/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://www.sunushop.sn$request_uri;
}

# --- Serveur principal HTTPS ---
server {
    listen       443 ssl http2;
    listen  [::]:443 ssl http2;
    server_name  www.sunushop.sn;

    # TLS — Let's Encrypt (vérifié par Cloudflare en mode Full Strict)
    ssl_certificate     /etc/letsencrypt/live/sunushop.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunushop.sn/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Sécurité HTTP
    include /etc/nginx/snippets/security-headers.conf;

    # Racine des fichiers statiques React (build Vite)
    root  /usr/share/nginx/html;
    index index.html;

    # Limite connexions simultanées par IP réelle (après CF real_ip)
    limit_conn connections 30;

    # ----------------------------------------------------------
    # 1. Routes admin — jamais cachées par Cloudflare
    # ----------------------------------------------------------
    location /admin {
        # Réinclure les security headers : les add_header de ce bloc surchargent
        # ceux du server block (comportement Nginx). Le nonce est injecté via sub_filter.
        include /etc/nginx/snippets/security-headers.conf;

        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once off;
        sub_filter_types text/html;

        add_header Cache-Control "no-store, private" always;
        add_header CDN-Cache-Control "no-store" always;

        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------
    # 2. Authentification — Rate limit strict (5 req/min)
    # ----------------------------------------------------------
    location /api/v1/auth/ {
        limit_req        zone=auth burst=5 nodelay;
        limit_req_status 429;

        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://api_backend;

        add_header Cache-Control "no-store, private" always;
    }

    # ----------------------------------------------------------
    # 3. Webhooks paiement — body brut, pas de rate limit
    # ----------------------------------------------------------
    location ~* ^/api/v1/payments/(stripe|wave|orange)/webhook {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass       http://api_backend;
        proxy_buffering  off;
        client_max_body_size 2m;
    }

    # ----------------------------------------------------------
    # 4. Upload fichiers — rate limit + timeout long
    # ----------------------------------------------------------
    location /api/v1/upload/ {
        limit_req  zone=uploads burst=5 nodelay;
        client_max_body_size 20m;

        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass         http://api_backend;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        add_header Cache-Control "no-store, private" always;
    }

    # ----------------------------------------------------------
    # 5. Socket.io WebSocket — connexion longue durée
    # ----------------------------------------------------------
    location /socket.io/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass         http://api_backend;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;

        # Cloudflare ne doit pas fermer les connexions WS
        add_header Cache-Control "no-store" always;
    }

    # ----------------------------------------------------------
    # 6. Health check — monitoring interne
    # ----------------------------------------------------------
    location = /api/health {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://api_backend;
        access_log off;
        add_header Cache-Control "no-store" always;
    }

    # ----------------------------------------------------------
    # 7. API catalogue (produits, catégories) — cache CDN 120s
    #    Couvre les listes ET les pages de détail (/slug/xxx)
    #    Bypass cache si requête authentifiée (Authorization header)
    # ----------------------------------------------------------
    location ~* ^/api/v1/(products|categories|services)(/.*)?$ {
        limit_req  zone=general burst=50 nodelay;

        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://api_backend;

        # Bypass cache pour les requêtes authentifiées (admin, espace client)
        proxy_cache_bypass $http_authorization;
        proxy_no_cache     $http_authorization;

        # s-maxage = cache CDN 120s / navigateur ne cache pas
        add_header Cache-Control "public, s-maxage=120, max-age=0, must-revalidate" always;
        add_header CDN-Cache-Control "max-age=120" always;
        add_header Vary "Accept-Encoding" always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_cache           api_cache;
        proxy_cache_key       "$scheme$request_method$host$request_uri";
        proxy_cache_valid     200 120s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock      on;
    }

    # ----------------------------------------------------------
    # 8. API générale — pas de cache (données utilisateur)
    # ----------------------------------------------------------
    location /api/ {
        limit_req  zone=general burst=50 nodelay;
        limit_req_status 429;

        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass http://api_backend;

        add_header Cache-Control "no-store, private" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ----------------------------------------------------------
    # 9. Assets statiques — cache navigateur 1 an + CDN 1 an
    #    Vite génère des noms de fichiers avec hash (ex: main.abc123.js)
    #    → Cloudflare peut les cacher indéfiniment en toute sécurité
    # ----------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|webp|gif|avif|mp4|webm)$ {
        expires    1y;
        add_header Cache-Control      "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control  "max-age=31536000" always;
        add_header Vary               "Accept-Encoding" always;
        access_log off;
        try_files  $uri =404;
    }

    # ----------------------------------------------------------
    # 10. Fichier manifeste PWA — cache court
    # ----------------------------------------------------------
    location ~* \.(webmanifest|manifest\.json)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header CDN-Cache-Control "max-age=86400" always;
        try_files $uri =404;
    }

    # ----------------------------------------------------------
    # 11. SPA React — index.html JAMAIS en cache
    #     (nouvelles versions déployées doivent être visibles immédiatement)
    #
    #     sub_filter remplace __CSP_NONCE__ par $request_id (unique par requête).
    #     La valeur doit correspondre au nonce dans le header CSP (security-headers.conf).
    #     sub_filter_once off : plusieurs occurrences dans index.html (GTM, FB, TikTok).
    # ----------------------------------------------------------
    location / {
        # Réinclure les security headers — obligatoire car ce bloc a ses propres add_header
        include /etc/nginx/snippets/security-headers.conf;

        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once off;
        sub_filter_types text/html;

        try_files $uri $uri/ /index.html;

        add_header Cache-Control     "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Pragma            "no-cache" always;
        add_header Expires           "0" always;
    }

    # ----------------------------------------------------------
    # Sécurité : bloquer /api/metrics de l'extérieur
    # (Prometheus scrape depuis le réseau Docker interne)
    # ----------------------------------------------------------
    location = /api/metrics {
        deny all;
        access_log    off;
        log_not_found off;
    }

    # ----------------------------------------------------------
    # Sécurité : bloquer fichiers cachés (.env, .git, .htaccess)
    # ----------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log    off;
        log_not_found off;
    }

    # ----------------------------------------------------------
    # Logs dédiés (incluent CF-Ray-ID via log_format main)
    # ----------------------------------------------------------
    access_log /var/log/nginx/sunushop.access.log main;
    error_log  /var/log/nginx/sunushop.error.log  warn;
}
