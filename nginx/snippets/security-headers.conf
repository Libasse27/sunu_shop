# =============================================================
# security-headers.conf — En-têtes de sécurité HTTP
# Inclure dans le server block HTTPS principal
# =============================================================

# HSTS — forcer HTTPS pendant 1 an (préchargement navigateurs)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Empêcher le MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking — autoriser uniquement la même origine
add_header X-Frame-Options "SAMEORIGIN" always;

# XSS Protection (legacy, le CSP est plus efficace)
add_header X-XSS-Protection "1; mode=block" always;

# Politique de referrer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions API
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

# Content Security Policy
# - scripts : self + Stripe (paiements)
# - images  : self + Cloudinary (produits) + data: blob: (previews)
# - connect : self + wss: (Socket.io) + APIs de paiement
# - frames  : Stripe uniquement
add_header Content-Security-Policy "
    default-src 'self';
    script-src  'self' 'unsafe-inline' 'unsafe-eval'
                https://js.stripe.com
                https://js.braintreegateway.com;
    style-src   'self' 'unsafe-inline'
                https://fonts.googleapis.com;
    font-src    'self'
                https://fonts.gstatic.com;
    img-src     'self' data: blob:
                https://res.cloudinary.com
                https://*.cloudinary.com
                https://images.unsplash.com;
    connect-src 'self' wss:
                https://api.stripe.com
                https://api.wave.com
                https://api.orange.com;
    frame-src   https://js.stripe.com;
    object-src  'none';
    base-uri    'self';
    form-action 'self';
    upgrade-insecure-requests;
" always;

# Empêcher Adobe Flash / PDF readers de lire des données cross-domain
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Empêcher le navigateur de deviner le type MIME des réponses (renforcé)
add_header Cross-Origin-Resource-Policy "same-origin" always;
