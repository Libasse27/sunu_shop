# =============================================================
# security-headers.conf — En-têtes de sécurité HTTP
# Inclure dans le server block HTTPS principal
# =============================================================

# HSTS — forcer HTTPS pendant 1 an (préchargement navigateurs)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Empêcher le MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking — autoriser uniquement la même origine
add_header X-Frame-Options "SAMEORIGIN" always;

# XSS Protection (legacy, le CSP est plus efficace)
add_header X-XSS-Protection "1; mode=block" always;

# Politique de referrer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions API
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

# Content Security Policy — Stratégie nonce via $request_id Nginx
#
# script-src :
#   - 'nonce-$request_id' : scripts inline protégés par nonce (GTM, FB Pixel, TikTok)
#     Le placeholder __CSP_NONCE__ dans index.html est remplacé par $request_id
#     via sub_filter dans location / et /admin (sunushop.conf).
#   - 'self' : bundle Vite (assets/index.*.js) servi depuis l'origine
#   - 'unsafe-eval' : requis par Google Tag Manager (eval interne) — à retirer si GTM supprimé
#   - domaines : fallback navigateurs ne supportant pas les nonces
#
# style-src :
#   - 'unsafe-inline' conservé pour framer-motion (injecte style="" dynamiquement)
#     Supprimer uniquement si framer-motion est retiré ou configuré avec CSS classes.
#
# IMPORTANT : les locations Nginx qui ont leurs propres add_header surchargent
# les directives du server block. Inclure ce fichier explicitement dans
# location / et location /admin (voir sunushop.conf).
add_header Content-Security-Policy "
    default-src 'self';
    script-src  'nonce-$request_id' 'self' 'unsafe-eval'
                https://js.stripe.com
                https://js.braintreegateway.com
                https://www.googletagmanager.com
                https://connect.facebook.net
                https://analytics.tiktok.com;
    style-src   'self' 'unsafe-inline'
                https://fonts.googleapis.com;
    font-src    'self'
                https://fonts.gstatic.com;
    img-src     'self' data: blob:
                https://res.cloudinary.com
                https://*.cloudinary.com
                https://images.unsplash.com
                https://www.facebook.com
                https://www.googletagmanager.com;
    connect-src 'self' wss:
                https://api.stripe.com
                https://api.wave.com
                https://api.orange.com
                https://www.googletagmanager.com
                https://www.google-analytics.com
                https://analytics.google.com
                https://connect.facebook.net
                https://www.facebook.com
                https://analytics.tiktok.com;
    frame-src   https://js.stripe.com
                https://www.googletagmanager.com;
    object-src  'none';
    base-uri    'self';
    form-action 'self';
    upgrade-insecure-requests;
" always;

# Empêcher Adobe Flash / PDF readers de lire des données cross-domain
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Empêcher le navigateur de deviner le type MIME des réponses (renforcé)
add_header Cross-Origin-Resource-Policy "same-origin" always;
