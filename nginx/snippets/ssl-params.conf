# =============================================================
# ssl-params.conf — Durcissement TLS (A+ sur SSL Labs)
# =============================================================

# Protocoles modernes uniquement
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;

# Suites de chiffrement modernes (ECDHE + AES-GCM + ChaCha20)
ssl_ciphers
    ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
    ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:
    ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:
    DHE-RSA-AES128-GCM-SHA256;

# Session TLS (performance)
ssl_session_cache   shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Diffie-Hellman (généré par init-letsencrypt.sh)
ssl_dhparam /etc/nginx/ssl/dhparam.pem;

# OCSP Stapling (vérifie la révocation du certificat)
ssl_stapling        on;
ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
resolver_timeout 5s;
