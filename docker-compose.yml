# =============================================================
# docker-compose.yml — Environnement de DÉVELOPPEMENT
# Usage : docker compose up
# =============================================================

name: sunushop-dev

services:

  mongo:
    image: mongo:7
    container_name: sunushop-mongo-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: sunushop
    volumes:
      - mongo_dev_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - sunushop-dev
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sunushop-redis-dev
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dev-redis-secret-change-me}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-secret-change-me}
    ports:
      - "6379:6379"       # accessible depuis l'hôte (Redis Insight, etc.)
    networks:
      - sunushop-dev
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-secret-change-me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      target: builder
    container_name: sunushop-api-dev
    restart: unless-stopped
    working_dir: /app
    command: npm run dev
    env_file:
      - .env
    environment:
      NODE_ENV:    development
      PORT:        5000
      MONGODB_URI: mongodb://mongo:27017/sunushop
      REDIS_URL:   redis://:${REDIS_PASSWORD:-dev-redis-secret-change-me}@redis:6379
    volumes:
      - ./server/src:/app/src:ro
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sunushop-dev

  client:
    image: node:20-alpine
    container_name: sunushop-client-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - sunushop-dev

volumes:
  mongo_dev_data:

networks:
  sunushop-dev:
    driver: bridge
