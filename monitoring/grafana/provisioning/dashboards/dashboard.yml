# =============================================================
# dashboard.yml — Provisioning des dashboards Grafana
# =============================================================

apiVersion: 1

providers:
  - name:            SunuShop
    orgId:           1
    type:            file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path:          /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
