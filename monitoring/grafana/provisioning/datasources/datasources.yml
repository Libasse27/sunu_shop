# =============================================================
# datasources.yml — Sources de données Grafana
# =============================================================

apiVersion: 1

datasources:
  # Prometheus — métriques (principal)
  - name:      Prometheus
    type:      prometheus
    uid:       prometheus
    url:       http://prometheus:9090
    isDefault: true
    access:    proxy
    editable:  false
    jsonData:
      timeInterval:     15s
      queryTimeout:     60s
      httpMethod:       POST
      prometheusType:   Prometheus
      prometheusVersion: 2.40.0

  # Loki — logs centralisés
  - name:    Loki
    type:    loki
    uid:     loki
    url:     http://loki:3100
    access:  proxy
    editable: false
    jsonData:
      maxLines:         1000
      derivedFields:
        - name:          TraceID
          matcherRegex:  "traceID=(\\w+)"
          url:           ""
