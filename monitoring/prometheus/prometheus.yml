# =============================================================
# prometheus.yml — Configuration Prometheus
# Scrape toutes les 15s les métriques de l'API et du système
# =============================================================

global:
  scrape_interval:     15s  # fréquence de collecte
  evaluation_interval: 15s  # fréquence d'évaluation des règles
  external_labels:
    environment: production
    project:     sunushop

# --- Règles d'alerte (optionnel — à compléter) ---
# rule_files:
#   - /etc/prometheus/rules/*.yml

# --- Cibles de scrape ---
scrape_configs:

  # Prometheus lui-même
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # API Node.js SunuShop
  - job_name: sunushop-api
    static_configs:
      - targets: ['server:5000']
    metrics_path: /api/metrics
    params:
      # Passer le token secret pour l'authentification
      format: ['prometheus']
    scheme: http
    authorization:
      type:        Bearer
      credentials_file: /etc/prometheus/metrics_token

  # Métriques système du serveur (CPU, RAM, disque)
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Métriques MongoDB
  - job_name: mongodb
    static_configs:
      - targets: ['mongodb-exporter:9216']

  # Métriques Redis
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
