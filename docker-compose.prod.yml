# =============================================================
# docker-compose.prod.yml — Stack PRODUCTION SunuShop
#
# Architecture complète :
#   Cloudflare CDN → Nginx → Node.js API → MongoDB
#                              ↓       ↓
#                           Redis   Queue Workers
#                              ↓
#                   Prometheus → Grafana
#                   Loki ← Promtail (logs Docker)
#
# Commande : docker compose -f docker-compose.prod.yml up -d
# =============================================================

name: techafrique-prod

services:

  # ============================================================
  # MongoDB — Replica Set rs0 (requis pour transactions ACID)
  # Un nœud unique en replica set suffit pour activer les transactions.
  # ============================================================
  mongo:
    image: mongo:7
    container_name: techafrique-mongo
    restart: always
    command: mongod --replSet rs0 --bind_ip_all --auth --keyFile /data/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE:      techafrique
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - mongo_keyfile:/data/mongo-keyfile:ro
    networks:
      - techafrique-internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Initialise le replica set une seule fois au premier démarrage
  mongo-rs-init:
    image: mongo:7
    container_name: techafrique-mongo-rs-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - techafrique-internal
    command: >
      mongosh --host mongo -u ${MONGO_ROOT_USER} -p ${MONGO_ROOT_PASSWORD} --authenticationDatabase admin --eval
      'try { rs.status(); print("RS déjà initialisé"); } catch(e) {
        rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
        print("RS initialisé");
      }'

  # ============================================================
  # Redis — Cache, sessions, rate limiting, queues, Socket.io
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: techafrique-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    networks:
      - techafrique-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ============================================================
  # API Node.js — Backend Express
  # ============================================================
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: techafrique-server:latest
    container_name: techafrique-api
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV:    production
      PORT:        5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/techafrique?authSource=admin&replicaSet=rs0
      REDIS_URL:   redis://:${REDIS_PASSWORD}@redis:6379
      CLIENT_URL:  https://www.techafrique.sn
      SERVER_URL:  https://www.techafrique.sn
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - techafrique-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # ============================================================
  # Workers BullMQ — Traitement asynchrone
  # (emails, notifications, factures)
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: techafrique-server:latest
    container_name: techafrique-worker
    restart: always
    command: ["node", "dist/worker.js"]
    env_file:
      - .env.production
    environment:
      NODE_ENV:    production
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/techafrique?authSource=admin&replicaSet=rs0
      REDIS_URL:   redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - techafrique-internal
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ============================================================
  # Nginx — Reverse proxy + fichiers statiques React
  # ============================================================
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: techafrique-nginx:latest
    container_name: techafrique-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - ./nginx/ssl/dhparam.pem:/etc/nginx/ssl/dhparam.pem:ro
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    depends_on:
      server:
        condition: service_healthy
    networks:
      - techafrique-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # ============================================================
  # Certbot — Renouvellement SSL automatique
  # ============================================================
  certbot:
    image: certbot/certbot:latest
    container_name: techafrique-certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
        trap exit TERM;
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
      "
    networks:
      - techafrique-internal

  # ============================================================
  # Backup MongoDB — Cron quotidien 2h00 + upload R2
  # ============================================================
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: techafrique-backup:latest
    container_name: techafrique-backup
    restart: always
    environment:
      MONGO_ROOT_USER:       ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD:   ${MONGO_ROOT_PASSWORD}
      BACKUP_R2_ACCOUNT_ID:  ${BACKUP_R2_ACCOUNT_ID:-}
      BACKUP_R2_ACCESS_KEY:  ${BACKUP_R2_ACCESS_KEY:-}
      BACKUP_R2_SECRET_KEY:  ${BACKUP_R2_SECRET_KEY:-}
      BACKUP_R2_BUCKET:      ${BACKUP_R2_BUCKET:-}
      BACKUP_WEBHOOK_URL:    ${BACKUP_WEBHOOK_URL:-}
    volumes:
      - backup_data:/backups
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - techafrique-internal
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ============================================================
  # Prometheus — Collecte des métriques
  # Accès : http://localhost:9090 (via SSH tunnel)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: techafrique-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    networks:
      - techafrique-internal
    # Port non exposé — accès via SSH tunnel ou Grafana
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ============================================================
  # Grafana — Dashboard de monitoring
  # Accès : http://localhost:3001 (via SSH tunnel)
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: techafrique-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_SERVER_ROOT_URL:         "http://localhost:3001"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # SMTP — envoi d'alertes email (réutilise le SMTP de l'API)
      GF_SMTP_ENABLED:        "true"
      GF_SMTP_HOST:           "${SMTP_HOST}:${SMTP_PORT}"
      GF_SMTP_USER:           "${SMTP_USER}"
      GF_SMTP_PASSWORD:       "${SMTP_PASS}"
      GF_SMTP_FROM_ADDRESS:   "${EMAIL_FROM}"
      GF_SMTP_FROM_NAME:      "TechAfrique Monitoring"
      # Variables pour les contact points (provisioning alerting)
      ALERT_EMAIL:              ${ALERT_EMAIL:-admin@techafrique.sn}
      ALERT_WEBHOOK_URL:        ${ALERT_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID:   ${ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"   # accessible UNIQUEMENT depuis localhost (SSH tunnel)
    depends_on:
      - prometheus
      - loki
    networks:
      - techafrique-internal
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ============================================================
  # Loki — Agrégation des logs
  # ============================================================
  loki:
    image: grafana/loki:latest
    container_name: techafrique-loki
    restart: always
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - techafrique-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ============================================================
  # Promtail — Collecte des logs Docker → Loki
  # ============================================================
  promtail:
    image: grafana/promtail:latest
    container_name: techafrique-promtail
    restart: always
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - techafrique-internal
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ============================================================
  # Node Exporter — Métriques système (CPU, RAM, disque)
  # ============================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: techafrique-node-exporter
    restart: always
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    networks:
      - techafrique-internal
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ============================================================
  # Redis Exporter — Métriques Redis pour Prometheus
  # ============================================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: techafrique-redis-exporter
    restart: always
    environment:
      REDIS_ADDR:     redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - techafrique-internal
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # ============================================================
  # MongoDB Exporter — Métriques MongoDB pour Prometheus
  # ============================================================
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: techafrique-mongo-exporter
    restart: always
    command:
      - '--mongodb.uri=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/admin'
      - '--collect-all'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - techafrique-internal
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

# ==============================================================
# Volumes
# ==============================================================
volumes:
  mongo_data:
  mongo_config:
  mongo_keyfile:  # Fichier keyfile pour l'auth inter-membres replica set
  redis_data:
  certbot_certs:
  certbot_www:
  nginx_logs:
  nginx_cache:
  backup_data:
  prometheus_data:
  grafana_data:
  loki_data:

# ==============================================================
# Réseau interne — seul Nginx + Grafana exposent des ports
# ==============================================================
networks:
  techafrique-internal:
    driver: bridge
