<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 238 70" fill="none">
  <defs>
    <!-- Dégradé drapeau sénégalais vert→jaune→rouge pour barre accent texte -->
    <linearGradient id="flagBar" x1="70" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00853F"/>
      <stop offset="50%"  stop-color="#D4920A"/>
      <stop offset="100%" stop-color="#E31B23"/>
    </linearGradient>

    <!-- Dégradé drapeau pour barre accent icône -->
    <linearGradient id="iconFlagBar" x1="8" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00853F"/>
      <stop offset="50%"  stop-color="#D4920A"/>
      <stop offset="100%" stop-color="#E31B23"/>
    </linearGradient>

    <!-- Dégradé éclair jaune → orange -->
    <linearGradient id="boltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FDEF42"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Ombre douce sur le panier -->
    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════ -->
  <!--         ICÔNE : PANIER FUTURISTE        -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Anses du panier (deux arcs symétriques) -->
  <path d="M 16 31 Q 16 9 28.5 9"
        stroke="#111111" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M 48 31 Q 48 9 35.5 9"
        stroke="#111111" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- Jonction anses : cercle vert (couleur drapeau) -->
  <circle cx="32" cy="9" r="3" fill="#00853F"/>

  <!-- Corps du panier : trapèze à bords arrondis en bas -->
  <path d="M 8 31 L 12.5 57 Q 13 61 17 61 L 47 61 Q 51 61 51.5 57 L 56 31 Z"
        stroke="#111111" stroke-width="2.2" fill="white" filter="url(#iconShadow)"/>

  <!-- Nervures verticales (très subtiles) -->
  <line x1="20"   y1="31" x2="19"   y2="61" stroke="#111" stroke-width="1" opacity="0.14"/>
  <line x1="32"   y1="31" x2="32"   y2="61" stroke="#111" stroke-width="1" opacity="0.14"/>
  <line x1="44"   y1="31" x2="45"   y2="61" stroke="#111" stroke-width="1" opacity="0.14"/>

  <!-- Nervure horizontale médiane -->
  <line x1="9.5"  y1="45" x2="54.5" y2="45" stroke="#111" stroke-width="1" opacity="0.14"/>

  <!-- ⚡ ÉCLAIR intégré dans le panier -->
  <path d="M 37 33  L 27 47  L 33 47  L 26 59  L 40 43  L 34 43  Z"
        fill="url(#boltGrad)" stroke="#C47A00" stroke-width="0.7" stroke-linejoin="round"/>

  <!-- Points d'angle (touches couleurs drapeau) -->
  <circle cx="8"  cy="31" r="3.2" fill="#00853F"/>
  <circle cx="56" cy="31" r="3.2" fill="#E31B23"/>

  <!-- Barre dégradé drapeau sous l'icône -->
  <rect x="8" y="64" width="48" height="3" rx="1.5" fill="url(#iconFlagBar)"/>


  <!-- ═══════════════════════════════════════ -->
  <!--         TEXTE : SUNU SHOP               -->
  <!-- ═══════════════════════════════════════ -->

  <!-- "Sunu" : ultra-bold, noir profond -->
  <text x="72" y="49"
        font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif"
        font-size="31"
        font-weight="900"
        fill="#111111"
        letter-spacing="-1">Sunu</text>

  <!-- Séparateur vertical fin entre les deux mots -->
  <line x1="150" y1="22" x2="150" y2="54" stroke="#CCCCCC" stroke-width="1.5"/>

  <!-- "Shop" : poids léger, vert sénégal -->
  <text x="157" y="49"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="31"
        font-weight="300"
        fill="#00853F"
        letter-spacing="-1">Shop</text>

  <!-- Barre dégradé drapeau sous le texte complet -->
  <rect x="72" y="55" width="150" height="2.5" rx="1.25" fill="url(#flagBar)"/>
</svg>
